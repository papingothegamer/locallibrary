<!-- =============================================================
     SIGNUP PAGE — signup.html
     =============================================================
     Extends: base_generic.html
     URL: /catalog/signup/ (name='signup')
     View: catalog/views.py → SignUpView (CreateView)
     =============================================================
     Displays a user registration form using Django's built-in
     UserCreationForm. Creates a new User object with username and
     password. On success, redirects to the login page
     (success_url = reverse_lazy('login')).
     ============================================================= -->

{% extends "base_generic.html" %}

{% block title %}Sign Up{% endblock %}

{% block content %}

  <h1>Join LocalLibrary</h1>

  <!-- =============================================================
       SIGNUP FORM
       =============================================================
       {{ form.as_p }} renders the UserCreationForm fields:
         - username
         - password1
         - password2 (confirmation)
       Django validates password strength via AUTH_PASSWORD_VALIDATORS
       defined in settings.py.
       ============================================================= -->
  <form method="post" action="{% url 'signup' %}">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Create Account</button>
  </form>

  <!-- LOGIN LINK: For users who already have an account -->
  <p style="margin-top: 15px;">Already have an account? <a href="{% url 'login' %}">Log in</a></p>

{% endblock %}
