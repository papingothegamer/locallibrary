{% extends "base_generic.html" %}
{% block content %}
  <div class="section-title">Login</div>
  {% if form.errors %}
    <p style="color: red;">Your username and password didn't match. Please try again.</p>
  {% endif %}
  <form method="post" action="{% url 'login' %}" style="background: #fff; padding: 2rem; border: 1px solid #e8e6df; border-radius: 10px;">
    {% csrf_token %}
    <table style="margin-bottom: 1rem;">
      <tr><td>{{ form.username.label_tag }}</td><td>{{ form.username }}</td></tr>
      <tr><td>{{ form.password.label_tag }}</td><td>{{ form.password }}</td></tr>
    </table>
    <input type="submit" value="Login" style="padding: 8px 16px; background: #4A83ED; color: white; border: none; border-radius: 6px; cursor: pointer;" />
    <input type="hidden" name="next" value="{{ next }}" />
  </form>
{% endblock %}
