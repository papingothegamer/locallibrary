{% extends "base_generic.html" %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <h2>Welcome Back</h2>
    
    {% if form.errors %}
      <div style="background: #FFEBEB; color: #EF233C; padding: 10px; border-radius: 6px; font-family: system-ui; font-size: 13px; margin-bottom: 15px;">
        Your username and password didn't match. Please try again.
      </div>
    {% endif %}

    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
      {{ form.as_p }}
      
      <button type="submit" class="btn-action btn-auth">Log In</button>
      <input type="hidden" name="next" value="{{ next|default:'/' }}" />
    </form>
    
    <div style="margin-top: 20px; font-family: system-ui; font-size: 13px; color: #666; border-top: 1px solid #eee; padding-top: 15px;">
      Don't have an account? <a href="{% url 'signup' %}" class="auth-link">Sign up here</a>
    </div>
  </div>
</div>
{% endblock %}
