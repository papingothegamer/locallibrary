<!-- =============================================================
     AUTHOR DELETE CONFIRMATION — author_confirm_delete.html
     =============================================================
     Extends: base_generic.html
     URL: /catalog/author/<pk>/delete/ (name='author-delete')
     View: catalog/views.py → AuthorDelete (DeleteView)
     =============================================================
     Asks the librarian to confirm deletion of an Author object.
     Requires 'catalog.delete_author' permission. On POST, the author
     is deleted and user is redirected to the author list
     (success_url = reverse_lazy('authors')).
     ============================================================= -->

{% extends "base_generic.html" %}

{% block title %}Delete Author{% endblock %}

{% block content %}

  <!-- CANCEL LINK: Returns to the author's detail page without deleting -->
  <p><a href="{{ author.get_absolute_url }}">&larr; Cancel</a></p>

  <h1>Delete Author</h1>

  <!-- =============================================================
       CONFIRMATION MESSAGE
       =============================================================
       Shows the author name and warns about permanent deletion.
       ============================================================= -->
  <p><strong>Are you sure you want to permanently delete "{{ author.full_name }}" and all associated records?</strong></p>

  <!-- DELETE FORM: POST submits the deletion -->
  <form action="" method="POST">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete author</button>
    <a href="{{ author.get_absolute_url }}" class="btn" style="background:#ccc;color:#333;">Cancel</a>
  </form>

{% endblock %}
