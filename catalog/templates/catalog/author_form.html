{% extends "base_generic.html" %}
{% block content %}
<div class="breadcrumbs"><a href="{% url 'authors' %}">&larr; Back to Authors</a></div>
<div class="glass-card" style="max-width: 600px; margin: 0 auto;">
  <div class="section-title">{% if object %}Update Author{% else %}Add New Author{% endif %}</div>
  <form action="" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="submit" value="Save Author" class="btn-action" style="margin-top: 15px;">
  </form>
</div>
{% endblock %}
