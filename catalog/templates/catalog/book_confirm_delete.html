<!-- =============================================================
     BOOK DELETE CONFIRMATION — book_confirm_delete.html
     =============================================================
     Extends: base_generic.html
     URL: /catalog/book/<pk>/delete/ (name='book-delete')
     View: catalog/views.py → BookDelete (DeleteView)
     =============================================================
     Asks the librarian to confirm deletion of a Book object.
     Requires 'catalog.delete_book' permission. On POST confirmation,
     the book is deleted and the user is redirected to the book list
     (success_url = reverse_lazy('books')).
     ============================================================= -->

{% extends "base_generic.html" %}

{% block title %}Delete Book{% endblock %}

{% block content %}

  <!-- CANCEL LINK: Returns to the book's detail page without deleting -->
  <p><a href="{{ book.get_absolute_url }}">&larr; Cancel</a></p>

  <h1>Delete Book</h1>

  <!-- =============================================================
       CONFIRMATION MESSAGE
       =============================================================
       Shows the book title and asks for confirmation before
       permanent deletion. This is a destructive action.
       ============================================================= -->
  <p><strong>Are you sure you want to permanently delete "{{ book.title }}"?</strong></p>

  <!-- DELETE FORM: POST submits the deletion; GET just shows this page -->
  <form action="" method="POST">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete book</button>
    <a href="{{ book.get_absolute_url }}" class="btn" style="background:#ccc;color:#333;">Cancel</a>
  </form>

{% endblock %}
