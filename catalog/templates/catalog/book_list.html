{% extends "base_generic.html" %}
{% block content %}
<div class="glass-card">
  <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; margin-bottom: 1.5rem; padding-bottom: 10px;">
    <div class="section-title" style="border: none; margin: 0; padding: 0;">Library Catalog</div>
    <div class="view-controls">
      <button onclick="toggleView('list')" id="btnList" class="btn-view active">List</button>
      <button onclick="toggleView('grid')" id="btnGrid" class="btn-view">Grid</button>
    </div>
  </div>

  <div id="listContainer" class="view-list">
    {% for book in book_list %}
      <div class="list-row">
        <div>
          <a href="{{ book.get_absolute_url }}" class="list-title">{{ book.title }}</a>
          <div class="list-subtitle">By {{ book.author.full_name }}</div>
        </div>
        <div class="genre-tag">{{ book.display_genre }}</div>
      </div>
    {% empty %}
      <div class="empty">No books found in the library.</div>
    {% endfor %}
  </div>
</div>

<script>
  function toggleView(viewType) {
    const container = document.getElementById('listContainer');
    const btnGrid = document.getElementById('btnGrid');
    const btnList = document.getElementById('btnList');
    
    if (viewType === 'grid') {
      container.classList.remove('view-list');
      container.classList.add('view-grid');
      btnGrid.classList.add('active');
      btnList.classList.remove('active');
      localStorage.setItem('catalogView', 'grid');
    } else {
      container.classList.remove('view-grid');
      container.classList.add('view-list');
      btnList.classList.add('active');
      btnGrid.classList.remove('active');
      localStorage.setItem('catalogView', 'list');
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    const savedView = localStorage.getItem('catalogView') || 'list';
    toggleView(savedView);
  });
</script>
{% endblock %}
