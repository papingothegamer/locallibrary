{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}LocalLibrary{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/styles.css' %}?v=4">
</head>
<body class="bg-sky">
  
  <div class="clouds-fixed">
    <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
    <div class="cloud c4"></div><div class="cloud c5"></div><div class="cloud c6"></div>
    <div class="cloud c7"></div><div class="cloud c8"></div>
  </div>

  <div class="nav-wrap">
    <a href="{% url 'index' %}" class="nav-link">Home</a>
    <a href="{% url 'books' %}" class="nav-link">Catalog</a>
    <a href="{% url 'authors' %}" class="nav-link">Authors</a>
    {% if user.is_authenticated %}
      <a href="{% url 'my-borrowed' %}" class="nav-link" style="color: #06D6A0;">My Desk</a>
      <form id="logout-form" method="post" action="{% url 'logout' %}?next=/" style="display:inline;">
        {% csrf_token %}
        <button type="submit" class="btn-nav-logout">Logout ({{ user.get_username }})</button>
      </form>
    {% else %}
      <a href="{% url 'login' %}?next={{request.path}}" class="nav-link">Login</a>
      <a href="{% url 'signup' %}" class="nav-link" style="background: rgba(255,255,255,0.2); padding: 4px 12px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.5);">Sign Up</a>
    {% endif %}
  </div>

  {% block pre_content %}{% endblock %}

  <div class="content-wrap">
    {% block content %}{% endblock %}
  </div>

</body>
</html>
